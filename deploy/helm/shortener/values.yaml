global:
  imagePullPolicy: IfNotPresent

# Image tags are REQUIRED and must be a git SHA (never "latest").
# CI writes them into gitops/dev/values.yaml.
api:
  image:
    repository: ghcr.io/aliyanmalik180/devops-platform/api
    tag: ""
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

worker:
  image:
    repository: ghcr.io/aliyanmalik180/devops-platform/worker
    tag: ""
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 100m, memory: 128Mi}

frontend:
  image:
    repository: ghcr.io/aliyanmalik180/devops-platform/frontend
    tag: ""
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}
  service:
    type: NodePort
    nodePort: 30080   # kind maps this to http://localhost:8081

# In-cluster PostgreSQL and Redis are for local/kind only.
# On a real cloud, disable them and use RDS / ElastiCache.
postgres:
  enabled: true
  image: postgres:16.6-alpine
  storage: 1Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}

redis:
  enabled: true
  image: redis:7.4.1-alpine
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}

# LOCAL ONLY placeholder. In real environments set create=false and let
# External Secrets Operator create a Secret with the same name and key.
secret:
  create: true
  name: shortener-db
  postgresPassword: change-me-local-only

networkPolicy:
  enabled: true
