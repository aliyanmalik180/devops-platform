kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # frontend NodePort 30080 -> http://localhost:8081
      # (8081 so it does not clash with docker compose on 8080)
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
  - role: worker
