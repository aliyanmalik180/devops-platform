name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install ruff==0.8.4
      - run: ruff check app && ruff format --check app
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: app/api/Dockerfile}
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: app/worker/Dockerfile}
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: app/frontend/Dockerfile}
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config -q

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix: {service: [api, worker]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/${{ matrix.service }}/requirements*.txt
      - run: pip install -r app/${{ matrix.service }}/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: app/${{ matrix.service }}

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint chart
        run: helm lint deploy/helm/shortener -f gitops/dev/values.yaml
      - name: Render chart
        run: helm template shortener deploy/helm/shortener -f gitops/dev/values.yaml > /dev/null

  build-scan:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    strategy:
      matrix: {service: [api, worker, frontend]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (tagged with commit SHA, never latest)
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.service }}
          load: true
          tags: shortener-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: shortener-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [build-scan, secrets-scan, helm]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: {service: [api, worker, frontend]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
