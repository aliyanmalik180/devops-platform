name: gitops-bump
# After CI publishes images for a commit on main, record that commit SHA in
# gitops/dev/values.yaml. Argo CD sees the change and deploys it.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA whose images should be deployed
        required: true

permissions:
  contents: write

jobs:
  bump:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write image tags
        env:
          SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "Invalid SHA: $SHA"; exit 1; fi
          cat > gitops/dev/values.yaml <<YAML
          # Managed by .github/workflows/gitops-bump.yml. Tags are git SHAs, never "latest".
          api:
            image:
              tag: "$SHA"
          worker:
            image:
              tag: "$SHA"
          frontend:
            image:
              tag: "$SHA"
          YAML
          echo "SHORT=${SHA::7}" >> "$GITHUB_ENV"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/dev/values.yaml
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "chore(gitops): deploy ${SHORT} to dev [skip ci]"
          git pull --rebase origin main
          git push origin main
